<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f3dfe6;
        --page: #f0d5df;
        --ink: #201518;
        --muted: #4a2d35;
        --line: rgba(33, 20, 24, 0.9);
        --soft: rgba(0, 0, 0, 0.15);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Cormorant Garamond', serif;
      }

      .page-shell {
        max-width: 1280px;
        margin: 1.5rem auto;
        padding: 0.8rem 1rem 1.5rem;
        background: var(--page);
        border: 2px solid var(--line);
        box-shadow: 0 0 0 6px rgba(255,255,255,0.12);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.8rem 1.4rem 0;
      }

      .brand {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: clamp(2rem, 2vw, 2.8rem);
        letter-spacing: 0.04em;
        color: var(--ink);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        padding: 0.2rem 0.35rem;
        border-bottom: 2px solid transparent;
      }

      .nav a.active,
      .nav a:hover {
        border-color: var(--line);
      }

      .hero {
        padding: 2rem 1.4rem 0;
        display: grid;
        grid-template-columns: 1.05fr 1.1fr;
        align-items: center;
        gap: 1rem;
      }

      .quote-block {
        padding-left: 0.5rem;
      }

      .quote-mark {
        font-size: 3rem;
        line-height: 0.8;
        color: var(--ink);
        display: inline-block;
        transform: translateY(-0.2rem);
      }

      .quote-text {
        font-size: clamp(2.1rem, 3vw, 4rem);
        line-height: 0.98;
        font-weight: 500;
        color: var(--ink);
        margin: 0.3rem 0 0;
        letter-spacing: 0.01em;
      }

      .empty-visual {
        width: 100%;
        min-height: 280px;
        border: 2px solid transparent;
      }

      .name-wrap {
        padding: 0 1.4rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 12vw, 16rem);
        line-height: 0.76;
        letter-spacing: -0.08em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255,255,255,0.9);
      }

      .subhead {
        margin-top: 0.3rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      @media (max-width: 860px) {
        .topbar {
          flex-direction: column;
        }

        .hero {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Sarahat</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="{{ site.baseurl }}/" class="active">Home page</a>
          <a href="{{ site.baseurl }}/ghazal/">Ghazal</a>
          <a href="{{ site.baseurl }}/shayari/">Shayari</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="quote-block">
            <span class="quote-mark">“</span>
            <p class="quote-text">My soul's wild passion longs to see the infinite</p>
          </div>
          <div class="empty-visual" aria-hidden="true"></div>
        </section>

        <div class="name-wrap">
          <h1>{{ site.title }}</h1>
          <div class="subhead">Jazbaat naama | Likhawat</div>
        </div>
      </main>
    </div>
  </body>
</html>
