<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f2e6d8;
        --bg-deep: #e7d3ba;
        --page: rgba(250, 245, 238, 0.9);
        --paper: rgba(255, 250, 244, 0.6);
        --ink: #201914;
        --muted: #5a463e;
        --line: rgba(48, 34, 25, 0.55);
        --accent: #7b5a39;
        --accent-soft: rgba(123, 90, 57, 0.12);
        --shadow: rgba(41, 29, 22, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14181d;
          --bg-deep: #0d1014;
          --page: rgba(22, 27, 31, 0.9);
          --paper: rgba(38, 44, 49, 0.7);
          --ink: #efe7df;
          --muted: #c8b5a3;
          --line: rgba(214, 200, 186, 0.28);
          --accent: #d8b373;
          --accent-soft: rgba(216, 179, 115, 0.1);
          --shadow: rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.38), transparent 35%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--ink);
        font-family: 'Cormorant Garamond', serif;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(rgba(44, 31, 21, 0.07) 0.7px, transparent 0.9px),
          radial-gradient(rgba(255,255,255,0.12) 0.6px, transparent 0.8px);
        background-position: 0 0, 4px 5px;
        background-size: 9px 9px;
        opacity: 0.38;
        mix-blend-mode: multiply;
      }

      .page-shell {
        position: relative;
        max-width: 1280px;
        margin: 1.5rem auto;
        padding: 0.8rem 1rem 1.5rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent), var(--page);
        border: 1px solid var(--line);
        box-shadow: 0 20px 45px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.2);
      }

      .page-shell::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(123, 90, 57, 0.22);
        pointer-events: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.8rem 1.4rem 0.5rem;
        border-bottom: 1px solid rgba(123, 90, 57, 0.25);
      }

      .brand {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: clamp(2rem, 2vw, 2.8rem);
        letter-spacing: 0.04em;
        color: var(--ink);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        padding: 0.35rem 0.5rem 0.2rem;
        border-bottom: 2px solid transparent;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .nav a.active,
      .nav a:hover {
        border-color: var(--accent);
        background: rgba(255,255,255,0.08);
      }

      .hero {
        position: relative;
        padding: 2rem 1.4rem 0;
        display: grid;
        grid-template-columns: 1.05fr 1.1fr;
        align-items: center;
        gap: 1rem;
      }

      .quote-block {
        position: relative;
        padding: 1.5rem 1.5rem 1.2rem;
        border: 1px solid rgba(123, 90, 57, 0.2);
        background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent), rgba(255,255,255,0.04);
        box-shadow: 0 12px 25px rgba(34, 24, 18, 0.04);
      }

      .quote-mark {
        font-size: 3rem;
        line-height: 0.8;
        color: var(--accent);
        display: inline-block;
        transform: translateY(-0.2rem);
      }

      .quote-text {
        font-size: clamp(2.1rem, 3vw, 4rem);
        line-height: 1.05;
        font-weight: 500;
        color: var(--ink);
        margin: 0.3rem 0 0;
        letter-spacing: 0.01em;
      }

      .empty-visual {
        width: 100%;
        min-height: 280px;
        border: 1px solid rgba(123, 90, 57, 0.2);
        background:
          linear-gradient(135deg, rgba(123, 90, 57, 0.06), rgba(255,255,255,0.04)),
          radial-gradient(circle at center, rgba(123, 90, 57, 0.12), transparent 60%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
      }

      .name-wrap {
        position: relative;
        padding: 0 1.4rem;
        margin-top: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 12vw, 16rem);
        line-height: 0.76;
        letter-spacing: -0.08em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255,255,255,0.82);
        text-shadow: 0 1px 0 rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.08);
      }

      .subhead {
        margin-top: 0.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      @media (max-width: 860px) {
        .topbar {
          flex-direction: column;
        }

        .hero {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Sarahat</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="{{ site.baseurl }}/" class="active">Home page</a>
          <a href="{{ site.baseurl }}/ghazal/">Ghazal</a>
          <a href="{{ site.baseurl }}/shayari/">Shayari</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="quote-block">
            <span class="quote-mark">“</span>
            <p class="quote-text">My soul's wild passion longs to see the infinite</p>
          </div>
          <div class="empty-visual" aria-hidden="true"></div>
        </section>

        <div class="name-wrap">
          <h1>{{ site.title }}</h1>
          <div class="subhead">Jazbaat naama | Likhawat</div>
        </div>
      </main>
    </div>
  </body>
</html>
