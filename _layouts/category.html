<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
              --bg: #180d15;
              --bg-deep: #2a1620;
              --bg-warm: #441f2d;
              --page: rgba(45, 28, 34, 0.9);
              --paper: rgba(79, 51, 59, 0.82);
              --paper-warm: rgba(238, 220, 200, 0.06);
              --ink: #f7edf1;
              --muted: #d6b4c4;
              --line: rgba(214, 170, 124, 0.34);
              --line-soft: rgba(239, 196, 158, 0.18);
              --accent: #e8c1b8;
              --accent-strong: #f7d9d0;
              --accent-soft: rgba(232, 183, 179, 0.12);
              --gold: #d5ae7d;
              --gold-soft: rgba(213, 174, 125, 0.18);
              --shadow: rgba(11, 5, 10, 0.55);
            }

            * { box-sizing: border-box; }

            html {
              background: var(--bg);
            }

            body {
              margin: 0;
              min-height: 100vh;
              background:
                radial-gradient(circle at 50% 0%, rgba(234, 166, 179, 0.18), transparent 28%),
                radial-gradient(circle at 20% 20%, rgba(157, 86, 102, 0.2), transparent 30%),
                linear-gradient(180deg, rgba(245, 227, 205, 0.05), transparent 26%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
              color: var(--ink);
              font-family: 'Cormorant Garamond', serif;
              position: relative;
            }

            body::before {
              content: "";
              position: fixed;
              inset: 0;
              pointer-events: none;
              background-image:
                linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
                radial-gradient(rgba(255, 240, 216, 0.18) 0.7px, transparent 1.1px),
                radial-gradient(rgba(94, 63, 60, 0.22) 0.8px, transparent 1.2px);
              background-position: 0 0, 0 0, 7px 9px;
              background-size: cover, 12px 12px, 14px 14px;
              opacity: 0.55;
              mix-blend-mode: screen;
            }

            .page-shell {
              position: relative;
              max-width: 1180px;
              margin: 1.5rem auto;
              padding: 1rem 1.2rem 2rem;
              background:
                linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
                var(--page);
              border: 1px solid var(--line);
              box-shadow: 0 18px 42px var(--shadow), inset 0 1px 0 rgba(255, 228, 210, 0.12);
              overflow: hidden;
            }

            .page-shell::before {
              content: "";
              position: absolute;
              inset: 12px;
              border: 1px solid var(--line-soft);
              pointer-events: none;
            }

            .page-shell::after {
              content: "";
              position: absolute;
              left: 20px;
              right: 20px;
              top: 18px;
              height: 1px;
              background: linear-gradient(90deg, transparent, var(--gold), transparent);
              opacity: 0.8;
              pointer-events: none;
            }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0.75rem 0.5rem;
        border-bottom: 1px solid rgba(123, 90, 57, 0.25);
      }

      .brand {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 2.5rem;
        letter-spacing: 0.05em;
        color: var(--ink);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 1.08rem;
        letter-spacing: 0.04em;
        border-bottom: 2px solid transparent;
        padding: 0.35rem 0.5rem 0.2rem;
        transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .nav a.active,
      .nav a:hover {
        border-color: var(--gold);
        background: rgba(232, 183, 179, 0.08);
        color: var(--accent-strong);
      }

      .content {
        padding: 2rem 1rem 0.5rem;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: clamp(2.8rem, 5vw, 5rem);
        letter-spacing: 0.02em;
        color: #f7dde3;
        text-shadow: 0 0 18px rgba(232, 183, 179, 0.16);
      }

      .category-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }

      .category-item {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent), var(--paper);
        box-shadow: 0 12px 28px rgba(10, 6, 9, 0.18);
      }

      .category-item a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1.05rem 1.25rem;
        color: var(--ink);
        text-decoration: none;
        border-top: 1px solid rgba(232, 183, 179, 0.12);
        border-bottom: 1px solid rgba(232, 183, 179, 0.12);
      }

      .category-item a:hover {
        background: var(--accent-soft);
      }

      .title-roman {
        font-size: clamp(1.5rem, 2vw, 2rem);
        line-height: 1.25;
      }

      .title-ur {
        font-family: 'Noto Nastaliq Urdu', serif;
        color: var(--accent);
        font-size: 1.5rem;
        line-height: 1.6;
      }

      @media (max-width: 660px) {
        .topbar {
          flex-direction: column;
        }

        .category-item a {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Sarahat</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="{{ site.baseurl }}/" class="active">Home page</a>
          <a href="{{ site.baseurl }}/ghazal/">Ghazal</a>
          <a href="{{ site.baseurl }}/shayari/">Shayari</a>
        </nav>
      </header>

      <main class="content">
        <h1>{{ page.title }}</h1>
        {{ content }}
      </main>
    </div>
  </body>
</html>
