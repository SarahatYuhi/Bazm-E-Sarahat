<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title_roman }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2e6d8;
            --bg-deep: #e7d3ba;
            --page: rgba(250, 245, 238, 0.9);
            --paper: rgba(255, 250, 244, 0.6);
            --ink: #201914;
            --muted: #5a463e;
            --line: rgba(48, 34, 25, 0.55);
            --accent: #7b5a39;
            --accent-soft: rgba(123, 90, 57, 0.12);
            --chip: rgba(123, 90, 57, 0.08);
            --shadow: rgba(41, 29, 22, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181d;
                --bg-deep: #0d1014;
                --page: rgba(22, 27, 31, 0.9);
                --paper: rgba(38, 44, 49, 0.7);
                --ink: #efe7df;
                --muted: #c8b5a3;
                --line: rgba(214, 200, 186, 0.28);
                --accent: #d8b373;
                --accent-soft: rgba(216, 179, 115, 0.1);
                --chip: rgba(216, 179, 115, 0.12);
                --shadow: rgba(0, 0, 0, 0.35);
            }
        }

        * { box-sizing: border-box; }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.38), transparent 35%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink);
            font-family: 'Cormorant Garamond', serif;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
              radial-gradient(rgba(44, 31, 21, 0.07) 0.7px, transparent 0.9px),
              radial-gradient(rgba(255,255,255,0.12) 0.6px, transparent 0.8px);
            background-position: 0 0, 4px 5px;
            background-size: 9px 9px;
            opacity: 0.38;
            mix-blend-mode: multiply;
        }

        .page {
            position: relative;
            max-width: 980px;
            margin: 1.4rem auto;
            padding: 0.8rem 1rem 2rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent), var(--page);
            border: 1px solid var(--line);
            box-shadow: 0 20px 45px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(123, 90, 57, 0.22);
            pointer-events: none;
        }

        .poem-card {
            position: relative;
            padding: 1.5rem 1.4rem 2rem;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.02em;
            color: var(--ink);
        }

        .title-ur {
            display: block;
            margin-top: 0.6rem;
            color: var(--accent);
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            line-height: 1.8;
        }

        .toggle {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1.5rem 0 2.1rem;
            padding-top: 0.25rem;
        }

        .toggle button {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.05);
            color: var(--ink);
            padding: 0.55rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.03);
        }

        .toggle button.on {
            background: var(--chip);
            border-color: var(--line);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .urdu,
        .roman {
            position: relative;
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            line-height: 1.9;
            letter-spacing: 0.01em;
            padding: 1.2rem 1rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent), rgba(255,255,255,0.02);
            border-top: 1px solid rgba(123, 90, 57, 0.18);
            border-bottom: 1px solid rgba(123, 90, 57, 0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            text-align: center;
            direction: rtl;
            color: var(--ink);
        }

        .roman {
            text-align: center;
            font-weight: 500;
            line-height: 1.8;
        }

        .sher {
            margin: 1.3rem 0;
            text-wrap: balance;
            color: var(--ink);
        }

        .hidden { display: none; }

        @media (max-width: 560px) {
            .page {
                margin: 0.8rem;
                padding: 0.5rem 0.8rem 1.5rem;
            }
            .poem-card {
                padding: 1rem 0.8rem 1.5rem;
            }
            .urdu,
            .roman {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <article class="poem-card">
        <h1>{{ page.title_roman }}<span class="title-ur" lang="ur" dir="rtl">{{ page.title_ur }}</span></h1>

        <div class="toggle">
            <button data-show="urdu">اردو</button>
            <button data-show="roman">Roman</button>
            <button data-show="both" class="on">Both</button>
        </div>

        {{ content }}
    </article>
</div>

<script>
    const buttons = document.querySelectorAll('.toggle button');
    const urdu = document.querySelector('.urdu');
    const roman = document.querySelector('.roman');

    function show(mode) {
      if (urdu) urdu.classList.toggle('hidden', mode === 'roman');
      if (roman) roman.classList.toggle('hidden', mode === 'urdu');
      buttons.forEach(b => b.classList.toggle('on', b.dataset.show === mode));
      try { localStorage.setItem('mode', mode); } catch (e) {}
    }

    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.show)));

    let saved = 'both';
    try { saved = localStorage.getItem('mode') || 'both'; } catch (e) {}
    show(saved);
</script>
</body>
</html>
