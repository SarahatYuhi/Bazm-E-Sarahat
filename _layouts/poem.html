<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title_roman }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
                    --bg: #180d15;
                    --bg-deep: #2a1620;
                    --bg-warm: #441f2d;
                    --page: rgba(45, 28, 34, 0.9);
                    --paper: rgba(79, 51, 59, 0.82);
                    --paper-warm: rgba(238, 220, 200, 0.06);
                    --ink: #f7edf1;
                    --muted: #d6b4c4;
                    --line: rgba(214, 170, 124, 0.34);
                    --line-soft: rgba(239, 196, 158, 0.18);
                    --accent: #e8c1b8;
                    --accent-strong: #f7d9d0;
                    --accent-soft: rgba(232, 183, 179, 0.12);
                    --chip: rgba(232, 183, 179, 0.08);
                    --gold: #d5ae7d;
                    --gold-soft: rgba(213, 174, 125, 0.18);
                    --shadow: rgba(11, 5, 10, 0.55);
                }

                * { box-sizing: border-box; }

                html {
                    background: var(--bg);
                }

                body {
                    margin: 0;
                    min-height: 100vh;
                    background:
                        radial-gradient(circle at 50% 0%, rgba(234, 166, 179, 0.18), transparent 28%),
                        radial-gradient(circle at 20% 20%, rgba(157, 86, 102, 0.2), transparent 30%),
                        linear-gradient(180deg, rgba(245, 227, 205, 0.05), transparent 26%),
                        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
                    color: var(--ink);
                    font-family: 'Cormorant Garamond', serif;
                    position: relative;
                }

                body::before {
                    content: "";
                    position: fixed;
                    inset: 0;
                    pointer-events: none;
                    background-image:
                      linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
                      radial-gradient(rgba(255, 240, 216, 0.18) 0.7px, transparent 1.1px),
                      radial-gradient(rgba(94, 63, 60, 0.22) 0.8px, transparent 1.2px);
                    background-position: 0 0, 0 0, 7px 9px;
                    background-size: cover, 12px 12px, 14px 14px;
                    opacity: 0.55;
                    mix-blend-mode: screen;
                }

                .page {
                    position: relative;
                    max-width: 980px;
                    margin: 1.4rem auto;
                    padding: 0.8rem 1rem 2rem;
                    background:
                      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
                      var(--page);
                    border: 1px solid var(--line);
                    box-shadow: 0 18px 42px var(--shadow), inset 0 1px 0 rgba(255, 228, 210, 0.12);
                    overflow: hidden;
                }

                .page::before {
                    content: "";
                    position: absolute;
                    inset: 12px;
                    border: 1px solid var(--line-soft);
                    pointer-events: none;
                }

                .page::after {
                    content: "";
                    position: absolute;
                    left: 18px;
                    right: 18px;
                    top: 18px;
                    height: 1px;
                    background: linear-gradient(90deg, transparent, var(--gold), transparent);
                    opacity: 0.8;
                    pointer-events: none;
                }

        .poem-card {
            position: relative;
            padding: 1.5rem 1.4rem 2rem;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.02em;
            color: #f9edf0;
            text-shadow: 0 0 18px rgba(232, 183, 179, 0.14);
        }

        .title-ur {
            display: block;
            margin-top: 0.6rem;
            color: var(--gold);
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            line-height: 1.8;
        }

        .toggle {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1.5rem 0 2.1rem;
            padding-top: 0.25rem;
        }

        .toggle button {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.03);
            color: var(--ink);
            padding: 0.55rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
        }

        .toggle button.on {
            background: var(--chip);
            border-color: var(--accent);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 18px rgba(232, 183, 179, 0.1);
        }

        .urdu,
        .roman {
            position: relative;
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            line-height: 1.9;
            letter-spacing: 0.01em;
            padding: 1.2rem 1rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent), rgba(255,255,255,0.01);
            border-top: 1px solid rgba(232, 183, 179, 0.14);
            border-bottom: 1px solid rgba(232, 183, 179, 0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            text-align: center;
            direction: rtl;
            color: var(--ink);
        }

        .roman {
            text-align: center;
            font-weight: 500;
            line-height: 1.8;
        }

        .sher {
            margin: 1.3rem 0;
            text-wrap: balance;
            color: var(--ink);
        }

        .hidden { display: none; }

        @media (max-width: 560px) {
            .page {
                margin: 0.8rem;
                padding: 0.5rem 0.8rem 1.5rem;
            }
            .poem-card {
                padding: 1rem 0.8rem 1.5rem;
            }
            .urdu,
            .roman {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <article class="poem-card">
        <h1>{{ page.title_roman }}<span class="title-ur" lang="ur" dir="rtl">{{ page.title_ur }}</span></h1>

        <div class="toggle">
            <button data-show="urdu">اردو</button>
            <button data-show="roman">Roman</button>
            <button data-show="both" class="on">Both</button>
        </div>

        {{ content }}
    </article>
</div>

<script>
    const buttons = document.querySelectorAll('.toggle button');
    const urdu = document.querySelector('.urdu');
    const roman = document.querySelector('.roman');

    function show(mode) {
      if (urdu) urdu.classList.toggle('hidden', mode === 'roman');
      if (roman) roman.classList.toggle('hidden', mode === 'urdu');
      buttons.forEach(b => b.classList.toggle('on', b.dataset.show === mode));
      try { localStorage.setItem('mode', mode); } catch (e) {}
    }

    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.show)));

    let saved = 'both';
    try { saved = localStorage.getItem('mode') || 'both'; } catch (e) {}
    show(saved);
</script>
</body>
</html>
