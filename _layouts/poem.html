<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title_roman }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3dfe6;
            --page: #f0d5df;
            --ink: #201518;
            --muted: #4a2d35;
            --line: rgba(33, 20, 24, 0.9);
            --accent: #8b465b;
            --chip: #f7e2ea;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Cormorant Garamond', serif;
        }

        .page {
            max-width: 980px;
            margin: 1.4rem auto;
            padding: 0.8rem 1rem 2rem;
            background: var(--page);
            border: 2px solid var(--line);
            box-shadow: 0 0 0 6px rgba(255,255,255,0.12);
        }

        .poem-card {
            padding: 1.2rem 1.4rem 2rem;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: 0.02em;
        }

        .title-ur {
            display: block;
            margin-top: 0.5rem;
            color: var(--accent);
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            line-height: 1.8;
        }

        .toggle {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1.5rem 0 2rem;
        }

        .toggle button {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .toggle button.on {
            background: var(--chip);
            border-color: var(--line);
        }

        .urdu,
        .roman {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            line-height: 1.9;
            letter-spacing: 0.01em;
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            text-align: center;
            direction: rtl;
            color: var(--ink);
        }

        .roman {
            text-align: center;
            font-weight: 500;
            line-height: 1.8;
        }

        .sher {
            margin: 1.4rem 0;
            text-wrap: balance;
        }

        .hidden { display: none; }

        @media (max-width: 560px) {
            .page {
                margin: 0.8rem;
                padding: 0.5rem 0.8rem 1.5rem;
            }
            .poem-card {
                padding: 1rem 0.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <article class="poem-card">
        <h1>{{ page.title_roman }}<span class="title-ur" lang="ur" dir="rtl">{{ page.title_ur }}</span></h1>

        <div class="toggle">
            <button data-show="urdu">اردو</button>
            <button data-show="roman">Roman</button>
            <button data-show="both" class="on">Both</button>
        </div>

        {{ content }}
    </article>
</div>

<script>
    const buttons = document.querySelectorAll('.toggle button');
    const urdu = document.querySelector('.urdu');
    const roman = document.querySelector('.roman');

    function show(mode) {
      if (urdu) urdu.classList.toggle('hidden', mode === 'roman');
      if (roman) roman.classList.toggle('hidden', mode === 'urdu');
      buttons.forEach(b => b.classList.toggle('on', b.dataset.show === mode));
      try { localStorage.setItem('mode', mode); } catch (e) {}
    }

    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.show)));

    let saved = 'both';
    try { saved = localStorage.getItem('mode') || 'both'; } catch (e) {}
    show(saved);
</script>
</body>
</html>
