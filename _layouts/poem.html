<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title_roman }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f8f1e7;
            --panel: rgba(255,255,255,0.24);
            --ink: #2b2118;
            --muted: #695647;
            --gold: #8a6d3b;
            --line: rgba(87, 63, 38, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
                radial-gradient(circle at top, #f8f2e9, #f2e7d8 40%, #efe3d1 100%);
            color: var(--ink);
            font-family: 'Cormorant Garamond', serif;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 1.2rem 4rem;
        }

        .poem-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 14px 32px rgba(50, 35, 25, 0.06);
            padding: 2rem 1.25rem 2.4rem;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.02em;
        }

        .title-ur {
            display: block;
            margin-top: 0.6rem;
            color: var(--gold);
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            line-height: 1.8;
        }

        .toggle {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin: 1.6rem 0 2.2rem;
        }

        .toggle button {
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--ink);
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .toggle button.on {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 8px 18px rgba(138, 109, 59, 0.2);
        }

        .urdu,
        .roman {
            font-size: clamp(1.15rem, 2vw, 1.45rem);
            line-height: 1.9;
            letter-spacing: 0.01em;
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            text-align: center;
            direction: rtl;
        }

        .roman {
            text-align: center;
            font-weight: 500;
            line-height: 1.8;
        }

        .sher {
            margin: 1.4rem 0;
            text-wrap: balance;
        }

        .hidden { display: none; }

        @media (max-width: 560px) {
            .poem-card {
                padding: 1.5rem 1rem 2rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <article class="poem-card">
        <h1>{{ page.title_roman }}<span class="title-ur" lang="ur" dir="rtl">{{ page.title_ur }}</span></h1>

        <div class="toggle">
            <button data-show="urdu">اردو</button>
            <button data-show="roman">Roman</button>
            <button data-show="both" class="on">Both</button>
        </div>

        {{ content }}
    </article>
</div>

<script>
    const buttons = document.querySelectorAll('.toggle button');
    const urdu = document.querySelector('.urdu');
    const roman = document.querySelector('.roman');

    function show(mode) {
      if (urdu) urdu.classList.toggle('hidden', mode === 'roman');
      if (roman) roman.classList.toggle('hidden', mode === 'urdu');
      buttons.forEach(b => b.classList.toggle('on', b.dataset.show === mode));
      try { localStorage.setItem('mode', mode); } catch (e) {}
    }

    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.show)));

    let saved = 'both';
    try { saved = localStorage.getItem('mode') || 'both'; } catch (e) {}
    show(saved);
</script>
</body>
</html>
